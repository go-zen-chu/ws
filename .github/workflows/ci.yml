name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.WS_KEYSTORE_BASE64 }}
      WS_KEYSTORE_PASSWORD: ${{ secrets.WS_KEYSTORE_PASSWORD }}
      WS_KEY_ALIAS: ${{ secrets.WS_KEY_ALIAS }}
      WS_KEY_PASSWORD: ${{ secrets.WS_KEY_PASSWORD }}
      WS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ws.jks"
          echo "WS_KEYSTORE_FILE=$RUNNER_TEMP/ws.jks" >> "$GITHUB_ENV"
      - name: Set version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "WS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test, lint and build
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ws-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
